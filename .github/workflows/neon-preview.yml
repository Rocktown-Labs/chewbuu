name: Neon Preview Branch & Migration Management

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  manage_neon_branch:
    name: Create & Migrate Neon Preview Branch
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'synchronize'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get branch expiration date (14 days from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create or Reuse Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        continue-on-error: true
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          expires_at: ${{ env.EXPIRES_AT }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

      - name: Run Database Migrations
        if: steps.create_neon_branch.outputs.db_url_with_pooler != ''
        run: |
          bun --cwd packages/db db:migrate
          bun --cwd packages/db db:migrate:raw
        env:
          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url_with_pooler }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Wait for preview CloudFormation stack
        if: steps.create_neon_branch.outputs.db_url_with_pooler != ''
        run: |
          stack_name="chewbuu-preview-pr-${{ github.event.number }}"
          if aws cloudformation describe-stacks --stack-name "$stack_name" >/dev/null 2>&1; then
            for attempt in $(seq 1 60); do
              status=$(aws cloudformation describe-stacks \
                --stack-name "$stack_name" \
                --query 'Stacks[0].StackStatus' \
                --output text)
              case "$status" in
                *_IN_PROGRESS|*_CLEANUP_IN_PROGRESS) sleep 10 ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|DELETE_FAILED)
                  echo "Preview stack cannot be deployed from state: $status"
                  exit 1
                  ;;
                *) echo "Preview stack is ready: $status"; break ;;
              esac
              if [ "$attempt" = "60" ]; then
                echo "Timed out waiting for preview stack: $status"
                exit 1
              fi
            done
          fi

      - name: Remove stale preview CloudFormation change set
        if: steps.create_neon_branch.outputs.db_url_with_pooler != ''
        continue-on-error: true
        run: aws cloudformation delete-change-set --stack-name "chewbuu-preview-pr-${{ github.event.number }}" --change-set-name cdk-deploy-change-set

      - name: Deploy AWS Blocks preview
        if: steps.create_neon_branch.outputs.db_url_with_pooler != ''
        run: bun run aws:deploy
        env:
          DEPLOY_FRONTEND_TO_AWS: "true"
          NITRO_PRESET: "aws-lambda"
          PR_NUMBER: ${{ github.event.number }}
          BLOCKS_DB_URL: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
          BLOCKS_SSM_PARAM_DB_URL: /chewbuu-prod-db-url
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'cg@rocktownlabs.com' }}
          BETTER_AUTH_ADMIN_EMAILS: ${{ vars.BETTER_AUTH_ADMIN_EMAILS || 'cg@rocktownlabs.com' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          VITE_SERVER_URL: "/"
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}

      - name: Load preview URL
        id: preview_url
        if: steps.create_neon_branch.outputs.db_url_with_pooler != ''
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name "chewbuu-preview-pr-${{ github.event.number }}" \
            --query "Stacks[0].Outputs[?OutputKey=='HostingUrl'].OutputValue" \
            --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview_url.outputs.url != '' && steps.preview_url.outputs.url != 'None'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `AWS preview deployed: ${process.env.PREVIEW_URL}`,
            });

  delete_neon_branch:
    name: Delete Neon Preview Branch on PR Close or Merge
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Delete Vercel-managed branch (preview/<head_ref>)
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/${{ github.head_ref }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

      - name: Delete PR number branch (preview/pr-<number>)
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.number }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

      - name: Delete hyphenated branch (preview-pr-<number>)
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview-pr-${{ github.event.number }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Delete AWS Blocks preview stack
        continue-on-error: true
        run: aws cloudformation delete-stack --stack-name "chewbuu-preview-pr-${{ github.event.number }}"
