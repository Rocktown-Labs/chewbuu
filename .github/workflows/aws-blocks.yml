name: AWS Blocks Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-blocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AWS Blocks backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap CDK environment
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap "aws://${account_id}/${AWS_REGION}"

      - name: Wait for an in-progress Blocks stack
        run: |
          if aws cloudformation describe-stacks --stack-name chewbuu-prod >/dev/null 2>&1; then
            status=$(aws cloudformation describe-stacks \
              --stack-name chewbuu-prod \
              --query 'Stacks[0].StackStatus' \
              --output text)
            if [ "$status" = "CREATE_IN_PROGRESS" ]; then
              aws cloudformation wait stack-create-complete --stack-name chewbuu-prod
            fi
          fi

      - name: Load existing realtime endpoint
        run: |
          ws_url=$(aws cloudformation describe-stacks \
            --stack-name chewbuu-prod \
            --query "Stacks[0].Outputs[?OutputKey=='RealtimeWsUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$ws_url" ] && [ "$ws_url" != "None" ]; then
            echo "BLOCKS_RT_WS_URL=$ws_url" >> "$GITHUB_ENV"
            echo "BLOCKS_RT_CALLBACK_URL=${ws_url/wss:/https:}" >> "$GITHUB_ENV"
          fi

      - name: Provision Better Auth secret
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          test -n "$BETTER_AUTH_SECRET"
          aws ssm put-parameter \
            --name /chewbuu-prod-auth-secret \
            --type SecureString \
            --overwrite \
            --value "$BETTER_AUTH_SECRET" \
            >/dev/null

      - name: Deploy Blocks backend & frontend
        run: bun run aws:deploy
        env:
          DEPLOY_FRONTEND_TO_AWS: "true"
          NITRO_PRESET: "aws-lambda"
          BLOCKS_DB_URL: ${{ secrets.BLOCKS_DB_URL }}
          BLOCKS_SSM_PARAM_DB_URL: /chewbuu-prod-db-url
          DATABASE_URL: ${{ secrets.BLOCKS_DB_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'cg@rocktownlabs.com' }}
          BETTER_AUTH_ADMIN_EMAILS: ${{ vars.BETTER_AUTH_ADMIN_EMAILS || 'cg@rocktownlabs.com' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          STRIPE_MINGLE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_MINGLE_ANNUAL_PRICE_ID }}
          STRIPE_MINGLE_PRICE_ID: ${{ secrets.STRIPE_MINGLE_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_SUGAR_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_SUGAR_ANNUAL_PRICE_ID }}
          STRIPE_SUGAR_PRICE_ID: ${{ secrets.STRIPE_SUGAR_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          VITE_SERVER_URL: "/"
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL || vars.VITE_NEON_AUTH_URL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}

      - name: Diagnostic - SSR Lambda env & logs
        if: always()
        run: |
          fn=$(aws lambda list-functions \
            --query "Functions[].FunctionName" --output text | tr '\t' '\n' | grep Computedefault | head -1)
          echo "SSR_LAMBDA=$fn"
          if [ -n "$fn" ]; then
            echo "--- env keys ---"
            aws lambda get-function-configuration --function-name "$fn" \
              --query 'Environment.Variables' --output json | python3 -c \
              "import json,sys; d=json.load(sys.stdin) or {}; [print(k,'=SET len',len(str(v))) for k,v in sorted(d.items()) if v]" || true
            echo "--- invoke root ---"
            echo '{"version":"1.0","resource":"/{proxy+}","path":"/","httpMethod":"GET","headers":{"Host":"d1cfwdtr24bsn.cloudfront.net"},"multiValueHeaders":{},"queryStringParameters":null,"pathParameters":{"proxy":""},"stageVariables":null,"requestContext":{"accountId":"1","resourceId":"a","stage":"prod","requestId":"t","identity":{"sourceIp":"1.2.3.4"},"resourcePath":"/{proxy+}","httpMethod":"GET","apiId":"x"},"body":null,"isBase64Encoded":false}' \
              > /tmp/payload.json
            aws lambda invoke --function-name "$fn" --payload file:///tmp/payload.json \
              --cli-binary-format raw-in-base64-out /tmp/out.json >/tmp/invoke-meta.txt 2>&1 || true
            cat /tmp/invoke-meta.txt
            echo "--- lambda error ---"
            head -c 400 /tmp/out.json 2>/dev/null
            echo
            echo "--- cloudwatch last 10m ---"
            aws logs filter-log-events --log-group-name "/aws/lambda/$fn" \
              --start-time "$(( $(date +%s) - 600 ))" \
              --query 'events[].message' --output text 2>&1 | tail -50 || true
          fi
