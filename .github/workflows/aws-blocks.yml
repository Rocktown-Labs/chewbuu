name: AWS Blocks Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-blocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AWS Blocks backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap CDK environment
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_ACCOUNT=$account_id" >> "$GITHUB_ENV"
          echo "CDK_DEFAULT_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          npx cdk bootstrap "aws://${account_id}/${AWS_REGION}"

      - name: Wait for an in-progress Blocks stack
        run: |
          if aws cloudformation describe-stacks --stack-name chewbuu-prod >/dev/null 2>&1; then
            for attempt in $(seq 1 60); do
              status=$(aws cloudformation describe-stacks \
                --stack-name chewbuu-prod \
                --query 'Stacks[0].StackStatus' \
                --output text)
              case "$status" in
                *_IN_PROGRESS|*_CLEANUP_IN_PROGRESS)
                  sleep 10
                  ;;
                UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED|DELETE_FAILED)
                  echo "CloudFormation stack cannot be deployed from state: $status"
                  exit 1
                  ;;
                *)
                  echo "CloudFormation stack is ready: $status"
                  break
                  ;;
              esac
              if [ "$attempt" = "60" ]; then
                echo "Timed out waiting for CloudFormation stack: $status"
                exit 1
              fi
            done
          fi

      - name: Load existing realtime endpoint
        run: |
          ws_url=$(aws cloudformation describe-stacks \
            --stack-name chewbuu-prod \
            --query "Stacks[0].Outputs[?OutputKey=='RealtimeWsUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$ws_url" ] && [ "$ws_url" != "None" ]; then
            echo "BLOCKS_RT_WS_URL=$ws_url" >> "$GITHUB_ENV"
            echo "BLOCKS_RT_CALLBACK_URL=${ws_url/wss:/https:}" >> "$GITHUB_ENV"
          fi

      - name: Provision Better Auth secret
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          test -n "$BETTER_AUTH_SECRET"
          aws ssm put-parameter \
            --name /chewbuu-prod-auth-secret \
            --type SecureString \
            --overwrite \
            --value "$BETTER_AUTH_SECRET" \
            >/dev/null

      - name: Ensure CloudFront ACM certificate
        run: |
          set -euo pipefail
          certificate_arn=""
          for candidate_arn in $(aws acm list-certificates \
            --certificate-statuses ISSUED \
            --query "CertificateSummaryList[?DomainName=='chewbuu.com'].CertificateArn" \
            --output text); do
            certificate_details=$(aws acm describe-certificate \
              --certificate-arn "$candidate_arn" --output json)
            if echo "$certificate_details" | jq -e \
              '.Certificate.SubjectAlternativeNames | index("www.chewbuu.com")' >/dev/null; then
              certificate_arn="$candidate_arn"
              break
            fi
          done
          if [ -z "$certificate_arn" ]; then
            certificate_arn=$(aws acm request-certificate \
              --domain-name chewbuu.com \
              --subject-alternative-names www.chewbuu.com \
              --validation-method DNS \
              --query CertificateArn \
              --output text)
            zone_id=$(aws route53 list-hosted-zones-by-name \
              --dns-name chewbuu.com. \
              --query "HostedZones[?Name=='chewbuu.com.'].Id | [0]" \
              --output text | sed 's#^/hostedzone/##')
            test -n "$zone_id" && test "$zone_id" != "None"
            for attempt in $(seq 1 30); do
              validation=$(aws acm describe-certificate \
                --certificate-arn "$certificate_arn" --output json)
              ready=true
              for domain in chewbuu.com www.chewbuu.com; do
                record_name=$(echo "$validation" | jq -r --arg domain "$domain" \
                  '.Certificate.DomainValidationOptions[] | select(.DomainName == $domain) | .ResourceRecord.Name // empty')
                record_value=$(echo "$validation" | jq -r --arg domain "$domain" \
                  '.Certificate.DomainValidationOptions[] | select(.DomainName == $domain) | .ResourceRecord.Value // empty')
                if [ -z "$record_name" ] || [ -z "$record_value" ]; then
                  ready=false
                  continue
                fi
                cat > /tmp/acm-change.json <<EOF
          {"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"$record_name","Type":"CNAME","TTL":300,"ResourceRecords":[{"Value":"$record_value"}]}}]}
          EOF
                aws route53 change-resource-record-sets --hosted-zone-id "$zone_id" --change-batch file:///tmp/acm-change.json >/dev/null
              done
              if [ "$ready" = true ]; then break; fi
              sleep 10
            done
            aws acm wait certificate-validated --certificate-arn "$certificate_arn"
          fi
          echo "CLOUDFRONT_CERTIFICATE_ARN=$certificate_arn" >> "$GITHUB_ENV"

      - name: Apply PlanetScale database migrations
        if: github.ref == 'refs/heads/main'
        run: |
          test -n "$BLOCKS_MIGRATION_DB_URL"
          bun run db:migrate
        env:
          BLOCKS_MIGRATION_DB_URL: ${{ secrets.BLOCKS_MIGRATION_DB_URL }}
          CHEWBUU_STAGE: production
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT || '/etc/ssl/certs/ca-certificates.crt' }}

      - name: Remove stale CloudFormation change set
        continue-on-error: true
        run: aws cloudformation delete-change-set --stack-name chewbuu-prod --change-set-name cdk-deploy-change-set

      - name: Deploy Blocks backend & frontend
        run: bun run aws:deploy
        env:
          DEPLOY_FRONTEND_TO_AWS: "true"
          NITRO_PRESET: "aws-lambda"
          CHEWBUU_STAGE: production
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          BLOCKS_DB_URL: ${{ secrets.BLOCKS_DB_URL }}
          BLOCKS_SSM_PARAM_DB_URL: /chewbuu-prod-db-url
          DATABASE_URL: ${{ secrets.BLOCKS_DB_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || 'camstewart7@gmail.com' }}
          BETTER_AUTH_ADMIN_EMAILS: ${{ vars.BETTER_AUTH_ADMIN_EMAILS || 'camstewart7@gmail.com' }}
          CORS_ORIGIN: https://chewbuu.com
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          VENUE_EMAIL_FROM: ${{ vars.VENUE_EMAIL_FROM || 'noreply@chewbuu.com' }}
          VENUE_APP_URL: ${{ vars.VENUE_APP_URL || 'https://chewbuu.com' }}
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          STRIPE_MINGLE_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_MINGLE_ANNUAL_PRICE_ID }}
          STRIPE_MINGLE_PRICE_ID: ${{ secrets.STRIPE_MINGLE_PRICE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_SUGAR_ANNUAL_PRICE_ID: ${{ secrets.STRIPE_SUGAR_ANNUAL_PRICE_ID }}
          STRIPE_SUGAR_PRICE_ID: ${{ secrets.STRIPE_SUGAR_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_SERVER_URL: "/"
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}

      - name: Show CloudFormation failure events
        if: failure()
        continue-on-error: true
        run: |
          aws cloudformation describe-stack-events \
            --stack-name chewbuu-prod \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table
