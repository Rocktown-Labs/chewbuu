name: AWS Blocks Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-blocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AWS Blocks backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap CDK environment
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap "aws://${account_id}/${AWS_REGION}"

      - name: Deploy Blocks backend
        run: bun run aws:deploy
        env:
          BLOCKS_DB_URL: ${{ secrets.BLOCKS_DB_URL }}
          BLOCKS_SSM_PARAM_DB_URL: /chewbuu-prod-db-url
          DATABASE_URL: ${{ secrets.BLOCKS_DB_URL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
